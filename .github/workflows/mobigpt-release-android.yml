name: MobiGPT Release APKs

on:
  push:
    tags:
      - 'mobigpt-v*'
  workflow_dispatch:
    inputs:
      publish-release:
        description: 'Create a GitHub prerelease with the validated APK/AAB assets'
        required: false
        default: false
        type: boolean
      release-tag:
        description: 'Release tag for manual publication; required when publish-release is true'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: mobigpt-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.21.0'
  ANDROID_PLATFORM: 'android-36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  ANDROID_NDK: '27.3.13750724'
  CMAKE_VERSION: '3.22.1'
  BUNDLETOOL_VERSION: '1.18.3'

jobs:
  validate-js:
    name: Validate MobiGPT JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Enable Corepack and Yarn
        run: |
          corepack enable
          yarn --version

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: TypeScript type check
        run: yarn typecheck

      - name: Run ESLint
        run: yarn lint

      - name: Run Lite-focused unit tests
        run: yarn jest src/services/modelRecommendations.test.ts --runInBand --coverage=false

  build-release-apks:
    name: Build optimized ${{ matrix.abi }} release APK
    needs: validate-js
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - x86_64
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Enable Corepack and Yarn
        run: corepack enable

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK}" "cmake;${CMAKE_VERSION}"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: Create CI-only environment configuration
        run: |
          cat > .env <<'EOF'
          FIREBASE_FUNCTIONS_URL=https://example.invalid/firebase-functions
          SUPABASE_URL=https://example.invalid/supabase
          SUPABASE_ANON_KEY=ci-placeholder
          PALSHUB_API_BASE_URL=https://example.invalid/palshub
          APP_URL=pocketpal://app
          ENABLE_PALSHUB_INTEGRATION=false
          ENABLE_AUTHENTICATION=false
          ENABLE_OFFLINE_MODE=true
          GOOGLE_IOS_CLIENT_ID=ci-placeholder
          GOOGLE_WEB_CLIENT_ID=ci-placeholder
          EOF

      - name: Create CI-only Google services configuration
        run: |
          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "mobigpt-ci",
              "storage_bucket": "mobigpt-ci.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": {"package_name": "com.pocketpallite"}
              },
              "api_key": [{"current_key": "ci-placeholder"}]
            }]
          }
          EOF

      - name: Build optimized release APK
        working-directory: android
        run: ./gradlew assembleProdRelease -PtargetAbi=${{ matrix.abi }} -PreactNativeArchitectures=${{ matrix.abi }} --no-daemon --stacktrace

      - name: Inspect release APK metadata and ABI
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/prod/release/app-prod-release.apk
          test -s "$APK"
          AAPT2=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort | tail -1)
          "$AAPT2" dump badging "$APK" | tee "MobiGPT-${{ matrix.abi }}-badging.txt"
          grep -q "package: name='com.pocketpallite'" "MobiGPT-${{ matrix.abi }}-badging.txt"
          grep -q "application-label:'MobiGPT'" "MobiGPT-${{ matrix.abi }}-badging.txt"
          abi_dirs=$(unzip -Z1 "$APK" | awk -F/ '$1 == "lib" && NF >= 2 {print $2}' | sort -u)
          test "$abi_dirs" = "${{ matrix.abi }}"
          test -n "$abi_dirs"

      - name: Rename APK and generate checksum
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/prod/release/app-prod-release.apk
          cp "$APK" "MobiGPT-release-${{ matrix.abi }}.apk"
          sha256sum "MobiGPT-release-${{ matrix.abi }}.apk" | tee "MobiGPT-release-${{ matrix.abi }}.apk.sha256"
          du -h "MobiGPT-release-${{ matrix.abi }}.apk" | tee "MobiGPT-release-${{ matrix.abi }}.size.txt"

      - name: Upload optimized ABI APK
        uses: actions/upload-artifact@v4
        with:
          name: MobiGPT-release-${{ matrix.abi }}
          path: |
            MobiGPT-release-${{ matrix.abi }}.apk
            MobiGPT-release-${{ matrix.abi }}.apk.sha256
            MobiGPT-release-${{ matrix.abi }}.size.txt
            MobiGPT-${{ matrix.abi }}-badging.txt
            android/app/build/outputs/mapping/prodRelease/*
          if-no-files-found: error
          retention-days: 30

  smoke-test-release:
    name: Smoke-test optimized release APK
    needs: build-release-apks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download x86_64 release APK
        uses: actions/download-artifact@v4
        with:
          name: MobiGPT-release-x86_64
          path: release

      - name: Install and launch optimized APK in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          boot-timeout: 900
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r release/MobiGPT-release-x86_64.apk
            adb shell am force-stop com.pocketpallite
            adb shell monkey -p com.pocketpallite 1
            sleep 30
            pid=$(adb shell pidof com.pocketpallite | tr -d '\r' || true)
            if ! printf '%s' "$pid" | grep -Eq '[0-9]'; then
              echo 'MobiGPT exited during startup; collecting logcat.' >&2
              adb logcat -d -b main -b system -b crash -v time >&2 || true
              exit 1
            fi
            echo "MobiGPT remained running with pid $pid"
            adb shell am force-stop com.pocketpallite

  build-and-inspect-bundle:
    name: Build and inspect optimized release AAB
    needs: validate-js
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Enable Corepack and Yarn
        run: corepack enable

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK}" "cmake;${CMAKE_VERSION}"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: Create CI-only configuration
        run: |
          cat > .env <<'EOF'
          FIREBASE_FUNCTIONS_URL=https://example.invalid/firebase-functions
          SUPABASE_URL=https://example.invalid/supabase
          SUPABASE_ANON_KEY=ci-placeholder
          PALSHUB_API_BASE_URL=https://example.invalid/palshub
          APP_URL=pocketpal://app
          ENABLE_PALSHUB_INTEGRATION=false
          ENABLE_AUTHENTICATION=false
          ENABLE_OFFLINE_MODE=true
          GOOGLE_IOS_CLIENT_ID=ci-placeholder
          GOOGLE_WEB_CLIENT_ID=ci-placeholder
          EOF
          mkdir -p android/app
          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {"project_number": "000000000000", "project_id": "mobigpt-ci", "storage_bucket": "mobigpt-ci.appspot.com"},
            "client": [{"client_info": {"mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": {"package_name": "com.pocketpallite"}}, "api_key": [{"current_key": "ci-placeholder"}]}]
          }
          EOF

      - name: Build optimized release AAB
        working-directory: android
        run: ./gradlew bundleProdRelease --no-daemon --stacktrace

      - name: Download bundletool
        run: curl --fail --location --retry 3 --output bundletool.jar "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"

      - name: Validate AAB and generate device-specific APK sets
        shell: bash
        run: |
          AAB=android/app/build/outputs/bundle/prodRelease/app-prod-release.aab
          test -s "$AAB"
          cat > arm64-device.json <<'EOF'
          {"supportedAbis":["arm64-v8a"],"supportedLocales":["en"],"screenDensity":420,"sdkVersion":35}
          EOF
          cat > x86-device.json <<'EOF'
          {"supportedAbis":["x86_64"],"supportedLocales":["en"],"screenDensity":420,"sdkVersion":35}
          EOF
          for spec in arm64 x86; do
            java -jar bundletool.jar build-apks \
              --bundle="$AAB" \
              --output="MobiGPT-${spec}.apks" \
              --mode=default \
              --device-spec="${spec}-device.json" \
              --ks=android/app/debug.keystore \
              --ks-key-alias=androiddebugkey \
              --ks-pass=pass:android \
              --key-pass=pass:android
            java -jar bundletool.jar get-size total --apks="MobiGPT-${spec}.apks" | tee "MobiGPT-${spec}-download-size.txt"
            unzip -l "MobiGPT-${spec}.apks" | tee "MobiGPT-${spec}-apks-list.txt"
          done
          sha256sum "$AAB" | tee MobiGPT-release.aab.sha256
          du -h "$AAB" | tee MobiGPT-release.aab.size.txt

      - name: Upload release AAB and bundletool inspection
        uses: actions/upload-artifact@v4
        with:
          name: MobiGPT-release-bundle-validation
          path: |
            android/app/build/outputs/bundle/prodRelease/app-prod-release.aab
            MobiGPT-release.aab.sha256
            MobiGPT-release.aab.size.txt
            MobiGPT-arm64-download-size.txt
            MobiGPT-x86-download-size.txt
            MobiGPT-arm64-apks-list.txt
            MobiGPT-x86-apks-list.txt
            arm64-device.json
            x86-device.json
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish MobiGPT prerelease assets
    needs: [build-release-apks, smoke-test-release, build-and-inspect-bundle]
    permissions:
      contents: write
    if: github.event_name == 'push' || inputs.publish-release == true
    runs-on: ubuntu-latest
    steps:
      - name: Validate manual release tag
        if: github.event_name == 'workflow_dispatch'
        run: test -n "${{ inputs.release-tag }}"

      - name: Download validated release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: MobiGPT-release-*
          merge-multiple: true
          path: release-assets

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || inputs.release-tag }}
          name: MobiGPT ${{ github.event_name == 'push' && github.ref_name || inputs.release-tag }}
          prerelease: true
          generate_release_notes: true
          files: |
            release-assets/MobiGPT-release-arm64-v8a.apk
            release-assets/MobiGPT-release-arm64-v8a.apk.sha256
            release-assets/MobiGPT-release-x86_64.apk
            release-assets/MobiGPT-release-x86_64.apk.sha256
            release-assets/app-prod-release.aab
            release-assets/MobiGPT-release.aab.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
