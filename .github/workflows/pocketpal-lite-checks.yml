name: MobiGPT Checks

on:
  push:
    branches:
      - main
      - pocketpal-lite
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'src/**'
      - 'package.json'
      - 'yarn.lock'
      - 'patches/**'
      - '.github/workflows/pocketpal-lite-checks.yml'
      - '.github/workflows/mobigpt-release-android.yml'
  pull_request:
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'src/**'
      - 'package.json'
      - 'yarn.lock'
      - 'patches/**'
      - '.github/workflows/pocketpal-lite-checks.yml'
      - '.github/workflows/mobigpt-release-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobigpt-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, and MobiGPT-focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: yarn

      - name: Enable Corepack and Yarn
        shell: bash
        run: |
          corepack enable
          yarn --version

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: TypeScript type check
        run: yarn typecheck

      - name: Run ESLint
        run: yarn lint

      - name: Run MobiGPT-focused unit tests
        run: yarn jest src/services/modelRecommendations.test.ts --runInBand --coverage=false
