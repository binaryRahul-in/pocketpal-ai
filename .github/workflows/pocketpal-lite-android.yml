name: MobiGPT Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobigpt-debug-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build MobiGPT prodDebug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: yarn

      - name: Enable Corepack and Yarn
        run: |
          corepack enable
          yarn --version

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724" "cmake;3.22.1"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: Create CI-only environment configuration
        run: |
          cat > .env <<'EOF'
          FIREBASE_FUNCTIONS_URL=https://example.invalid/firebase-functions
          SUPABASE_URL=https://example.invalid/supabase
          SUPABASE_ANON_KEY=ci-placeholder
          PALSHUB_API_BASE_URL=https://example.invalid/palshub
          APP_URL=pocketpal://app
          ENABLE_PALSHUB_INTEGRATION=false
          ENABLE_AUTHENTICATION=false
          ENABLE_OFFLINE_MODE=true
          GOOGLE_IOS_CLIENT_ID=ci-placeholder
          GOOGLE_WEB_CLIENT_ID=ci-placeholder
          EOF

      - name: Create CI-only Google services configuration
        run: |
          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "mobigpt-ci",
              "storage_bucket": "mobigpt-ci.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": {"package_name": "com.pocketpallite"}
              },
              "api_key": [{"current_key": "ci-placeholder"}]
            }]
          }
          EOF

      - name: Build universal debug APK
        working-directory: android
        run: ./gradlew assembleProdDebug --no-daemon --stacktrace

      - name: Verify and rename debug APK
        run: |
          test -s android/app/build/outputs/apk/prod/debug/app-prod-debug.apk
          cp android/app/build/outputs/apk/prod/debug/app-prod-debug.apk MobiGPT-debug-universal.apk
          sha256sum MobiGPT-debug-universal.apk | tee MobiGPT-debug-universal.apk.sha256

      - name: Upload MobiGPT debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MobiGPT-debug-universal
          path: |
            MobiGPT-debug-universal.apk
            MobiGPT-debug-universal.apk.sha256
          if-no-files-found: error
          retention-days: 14
